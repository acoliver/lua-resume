[package]
name = "lua-resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Save and resume suspended Lua 5.4 coroutines from source, without VM internals or bytecode in saves"
repository = "https://github.com/acoliver/lua-resume"
publish = false

[dependencies]
mlua = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.17"

[dev-dependencies]
lua-resume-debug = { path = "crates/lua-resume-debug" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
members = [".", "crates/lua-resume-debug"]

[workspace.dependencies]
mlua = { version = "=0.10.5", features = ["lua54", "vendored"] }
