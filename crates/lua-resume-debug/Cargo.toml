[package]
name = "lua-resume-debug"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Creates a Lua state whose debug library only the host can reach"
repository = "https://github.com/acoliver/lua-resume"
publish = false

[dependencies]
mlua = { workspace = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
